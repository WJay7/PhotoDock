name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build executable
        run: |
          python -m pip install --upgrade pip pyinstaller pillow pystray
          python scripts\create_icon.py
          pyinstaller --noconfirm --onefile --windowed --icon assets\photodock.ico --add-data "assets\photodock-32.ico;assets" --name PhotoDock photodock.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer\PhotoDock.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDock-Windows
          path: dist\PhotoDock-Setup.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\PhotoDock-Setup.exe --title "PhotoDock $env:GITHUB_REF_NAME" --generate-notes
